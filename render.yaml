services:
  - type: web
    name: ceo-virtual-agent
    env: python
    region: oregon  # or frankfurt if you prefer Europe
    plan: free  # upgrade to starter for no sleep + persistent disk
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    pythonVersion: 3.11.9  # Important: crewai and many packages don't support 3.14 yet
    envVars:
      # Add your secrets here in the Render dashboard (do NOT commit keys)
      # GROQ_API_KEY: your-key-here
      # GOOGLE_API_KEY: your-free-gemini-key-here (get at aistudio.google.com/app/apikey - best free tier)
      # LLM_PROVIDER: groq   # or gemini
      # No keys? System auto uses DEGRADED KEYLESS mode (still fully functional for research/assets/approvals)
    # For persistent storage of generated content and memory (recommended for production)
    # disk:
    #   name: ceo-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
    # Note: Free plan has no persistent disk and sleeps after inactivity.
    # For 24/7 autonomous agent, use a Background Worker + paid plan or run the agent script separately.